<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1b26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Build a dam. Release the flood. Find out where it breaks.">
<title>DAM BREAK</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
<!-- Favicon: the DAM BREAK motif at 32 px — impounded water on the left, a
     concrete face with a timber tie, and a bright burst tearing out through the
     breach. Same silhouette as icons/icon-512.png (tools/make-icons.py), reduced
     to the four shapes that still read in a browser tab. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230d1b26'/><path d='M1 11h13v17H1z' fill='%232f8fd4'/><path d='M1 11h13v1.8H1z' fill='%23a5e2ff'/><path d='M12.4 5h6.4l2.4 23h-11z' fill='%23c3ced6'/><path d='M12.9 13.2h8.1v2.1h-8.1z' fill='%23c8954a'/><path d='M13.2 17.4h8.6l.6 10.6H13z' fill='%230d1b26'/><path d='M13 17.6c4.1-.6 6.2 2.4 9.9 1.6 3.7-.8 6.2 1.9 8.1 4.2V28H13z' fill='%2335a7ff'/><path d='M13 17.6c4.1-.6 6.2 2.4 9.9 1.6 3.7-.8 6.2 1.9 8.1 4.2v2.1c-2.6-2.4-5-4.3-8.3-3.5-3.3.8-5.6-2-9.7-1.5z' fill='%23dff2ff'/></svg>">
</head>
<body>

<!-- ==================== SPLASH ====================
     Deliberately inline, markup AND style, and placed before the module script:
     it must paint on the very first frame the browser composites, with no
     JavaScript and no second network round-trip. On a warm load it is visible
     for a blink; on a cold 3G first load it is the whole first second, which is
     exactly when a black screen loses a player. screens.init() removes it.
     Colours are literals, not CSS variables, so it renders correctly even if
     styles.css has not arrived yet. -->
<style>
/* The wordmark's type metrics and vertical position deliberately MATCH
   #screen-title's .logo in styles.css (same clamp, weight, tracking, and the
   same 24vh lift). That is the whole trick of this splash: when screens.init()
   fades it out, the letters underneath are already in exactly the same place, so
   the handover reads as the tagline and buttons fading IN rather than as the
   page jumping. Keep the two in step if either changes. */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;background:#0d1b26;
  padding-bottom:24vh;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#dfe9f0;
  transition:opacity .28s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .sp-word{font-size:clamp(40px,11vw,84px);font-weight:800;letter-spacing:.05em;
  line-height:1;text-shadow:0 2px 4px rgba(4,10,16,.95),0 6px 34px rgba(4,10,16,.8)}
#splash .sp-word span{color:#35a7ff}
/* the broken rule, same geometry as the title screen's */
#splash .sp-rule{position:relative;width:min(66vw,300px);height:16px;margin-top:10px}
#splash .sp-rule i{position:absolute;top:0;height:3px;border-radius:2px;background:#35a7ff}
#splash .sp-rule i:first-child{left:0;width:50%;box-shadow:0 0 14px rgba(53,167,255,.45)}
#splash .sp-rule i:last-child{right:0;width:34%;transform:translateY(7px) rotate(2.6deg);background:#1d5f8a}
/* Pure-CSS water, no assets and no JS: a blue wash rising from the bottom edge,
   with two sets of WIDE soft light bands counter-drifting across it. Wide and
   soft is the point — the first attempt used 2-3 px stripes at 100deg, which at
   that angle are near-vertical hairlines and read unmistakably as rain. */
#splash .sp-water{position:absolute;left:0;right:0;bottom:0;height:36%;overflow:hidden;
  pointer-events:none;background:linear-gradient(to top,rgba(53,167,255,.13),transparent);
  -webkit-mask-image:linear-gradient(to top,#000 20%,transparent);
  mask-image:linear-gradient(to top,#000 20%,transparent)}
#splash .sp-water span{position:absolute;left:-60%;bottom:0;width:220%;
  animation:sp-drift 11s linear infinite}
#splash .sp-water span:nth-child(1){height:100%;opacity:.55;
  background-image:repeating-linear-gradient(174deg,
    rgba(53,167,255,0) 0 26px,rgba(53,167,255,.30) 46px,rgba(53,167,255,0) 66px 118px)}
#splash .sp-water span:nth-child(2){height:70%;opacity:.5;animation-duration:7s;animation-direction:reverse;
  background-image:repeating-linear-gradient(177deg,
    rgba(165,226,255,0) 0 14px,rgba(165,226,255,.26) 24px,rgba(165,226,255,0) 34px 74px)}
#splash .sp-hint{font-size:12px;letter-spacing:.22em;color:#61798c;margin-top:16px}
@keyframes sp-drift{from{transform:translateX(0)}to{transform:translateX(27.27%)}}
@media (prefers-reduced-motion:reduce){#splash .sp-water span{animation:none}}
</style>
<div id="splash" aria-hidden="true">
  <div class="sp-water"><span></span><span></span></div>
  <div class="sp-word">DAM<span>BREAK</span></div>
  <div class="sp-rule"><i></i><i></i></div>
  <p class="sp-hint">LOADING</p>
</div>

<div id="wrap">
  <canvas id="game"></canvas>

  <!-- HUD (build + sim). ui/hud.js owns behavior; OPUS C owns markup below. -->
  <div id="hud" class="hidden">
    <div id="hud-top">
      <div id="hud-level">
        <span id="hud-level-name"></span>
        <span id="hud-objective"></span>
        <div id="objective-meter" class="meter hidden"><i id="objective-fill"></i></div>
      </div>

      <div id="hud-timer" class="hidden">
        <span id="timer-text"></span>
        <span class="hud-label">FLOOD ARRIVES</span>
      </div>

      <div id="hud-right">
        <div id="hud-budget">
          <span id="budget-left"></span>
          <span class="hud-label">LEFT OF <span id="budget-total"></span></span>
          <div id="budget-meter" class="meter"><i id="budget-fill"></i></div>
        </div>
        <div id="hud-readouts" class="hidden">
          <div class="readout"><span id="stat-load">—</span><span class="hud-label">PEAK LOAD</span></div>
          <div class="readout"><span id="stat-retained">—</span><span class="hud-label">HELD</span></div>
        </div>
      </div>
    </div>

    <div id="hud-toast" aria-live="polite"></div>
    <button id="btn-hud-menu" class="tool-btn" type="button" title="Levels (Esc)" aria-label="Levels">☰</button>

    <!-- ==================== THE BOTTOM STACK ====================
         One bottom-anchored flex column owns EVERYTHING at the foot of the
         screen: the tutorial card, the build hint, the toolbar (materials +
         tool cluster + RELEASE WATER) and the sim controls. These used to be
         five independently absolute-positioned boxes that reserved space from
         each other with magic pixel offsets — which is precisely how the tool
         cluster (erase/undo/redo/clear) ended up scrolled off the right edge on
         a phone, and how the build hint ended up sitting on the release button.

         In a flex column overlap is structurally impossible. And because the
         column is anchored at the BOTTOM and grows upwards, showing or hiding a
         row ABOVE the toolbar (a hint, the tutorial) never moves the controls
         that are already under the player's thumb. -->
    <div id="hud-bottom">
      <!-- First-level tutorial. Above the toolbar in the stack on purpose: it
           can never cover the controls it is talking about. -->
      <div id="tutorial" class="hidden">
        <div class="tut-card">
          <span id="tut-step" class="tut-step"></span>
          <h3 id="tut-title"></h3>
          <p id="tut-text"></p>
          <div class="tut-foot">
            <div id="tut-dots" class="tut-dots"></div>
            <button class="small-btn ghost-btn" id="btn-tut-skip" type="button">SKIP</button>
            <button class="small-btn primary-btn" id="btn-tut-next" type="button">GOT IT →</button>
          </div>
        </div>
      </div>

      <div id="build-hint" class="hidden"></div>

      <div id="toolbar">
        <!-- (a) MATERIALS — the only thing allowed to scroll. hud.js fills
                 #material-bar and toggles the fade-l/fade-r masks on the strip
                 so a clipped strip visibly reads as scrollable. -->
        <div id="material-strip"><div id="material-bar"></div></div>

        <!-- (b) TOOLS — fixed, never scrolled, never under the release button. -->
        <div id="tool-group">
          <button id="btn-tool-build" class="tool-btn" type="button"
                  title="Build beams — drag between anchors" aria-label="Build beams">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6 18 18 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
              <circle cx="6" cy="18" r="2.7" fill="currentColor"/>
              <circle cx="18" cy="6" r="2.7" fill="currentColor"/>
            </svg>
          </button>
          <button id="btn-erase" class="tool-btn danger" type="button"
                  title="Erase — drag across beams to delete them (E)" aria-label="Erase">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9.4 19.5 4.6 14.7a1.6 1.6 0 0 1 0-2.3l7.6-7.6a1.6 1.6 0 0 1 2.3 0l4.8 4.8a1.6 1.6 0 0 1 0 2.3l-7.7 7.6z"
                    fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M9.4 19.5H20" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <path d="M8.6 8.6 15.4 15.4" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
            </svg>
          </button>
          <!-- NEW: box delete. Dashed square with an ×, because that is exactly
               what the tool draws on the world (renderer.drawMarquee). -->
          <button id="btn-boxdelete" class="tool-btn danger" type="button"
                  title="Box delete — drag a box over a section to delete it (X)" aria-label="Box delete">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="3.4" y="3.4" width="17.2" height="17.2" rx="2.2" fill="none"
                    stroke="currentColor" stroke-width="1.6" stroke-dasharray="3.4 2.7"/>
              <path d="M8.9 8.9 15.1 15.1M15.1 8.9 8.9 15.1" stroke="currentColor"
                    stroke-width="2.1" stroke-linecap="round"/>
            </svg>
          </button>
          <span class="tool-sep" aria-hidden="true"></span>
          <button id="btn-undo" class="tool-btn" type="button" title="Undo (Z)" aria-label="Undo">↶</button>
          <button id="btn-redo" class="tool-btn" type="button" title="Redo (Y)" aria-label="Redo">↷</button>
          <button id="btn-clear" class="tool-btn" type="button" title="Clear the whole dam" aria-label="Clear the whole dam">🗑</button>
        </div>

        <button id="btn-release" class="big-btn release hidden" type="button">⚠ RELEASE WATER</button>
      </div>

      <div id="sim-controls" class="hidden">
        <button class="speed-btn" data-speed="0" type="button" aria-label="Pause">⏸</button>
        <button class="speed-btn" data-speed="0.25" type="button">¼×</button>
        <button class="speed-btn active" data-speed="1" type="button">1×</button>
        <button class="speed-btn" data-speed="2" type="button">2×</button>
        <button class="speed-btn" data-speed="4" type="button">4×</button>
        <button id="btn-sim-retry" class="tool-btn" type="button" title="Retry (R)" aria-label="Retry">↻</button>
        <button id="btn-sim-edit" class="tool-btn" type="button" title="Edit dam" aria-label="Edit dam">✎</button>
      </div>
    </div>
  </div>

  <!-- Screens. OPUS C owns markup + screens.js behavior.
       #screen-title carries no decorative water of its own any more: the live
       diorama in src/ui/titleScene.js is behind it on the real canvas, and this
       screen's job is now only to stay readable over it. -->
  <div id="screen-title" class="screen">
    <div class="logo">
      <h1>DAM<span class="accent">BREAK</span></h1>
      <div class="logo-rule" aria-hidden="true"><i></i><i></i></div>
      <p class="tagline">When the water arrives — will your dam hold?</p>
    </div>
    <button class="big-btn pulse" id="btn-play" type="button">▶ PLAY</button>
    <button class="small-btn" id="btn-sandbox" type="button">⚒ SANDBOX</button>
    <button class="small-btn update-btn hidden" id="btn-update" type="button">⬆ UPDATE READY</button>
    <p class="hint">Drag to build · pinch or wheel to zoom · Space to release the flood</p>
    <span id="game-version" class="version-tag"></span>
  </div>

  <div id="screen-levels" class="screen hidden">
    <div class="screen-head">
      <h2>SELECT LEVEL</h2>
      <p id="levels-progress" class="tagline"></p>
    </div>
    <div id="level-grid"></div>
    <button class="small-btn" id="btn-levels-back" type="button">BACK</button>
  </div>

  <div id="screen-result" class="screen hidden">
    <div class="end-card">
      <h2 id="result-heading">DAM TEST COMPLETE</h2>
      <p id="result-cause" class="tagline hidden"></p>
      <p id="result-note" class="result-note hidden"></p>
      <div id="result-stats" class="end-stats"></div>
      <div class="result-btns">
        <button class="big-btn" id="btn-result-retry" type="button">↻ RETRY</button>
        <button class="small-btn" id="btn-result-edit" type="button">✎ EDIT DAM</button>
        <button class="small-btn" id="btn-result-next" type="button">NEXT LEVEL →</button>
        <button class="small-btn" id="btn-result-menu" type="button">LEVELS</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
